version: "3.8"

services:

  mysql:
    image: mysql:8.0

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test_db
      MYSQL_USER: devops
      MYSQL_PASSWORD: devops123

    volumes:
      - mysql-data:/var/lib/mysql

    networks:
      - app-network

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: ./backend

    ports:
      - "8081:8080"

    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/test_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: devops
      SPRING_DATASOURCE_PASSWORD: devops123

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - app-network


  frontend:
    build:
      context: ./frontend

    ports:
      - "4200:80"

    depends_on:
      - backend

    networks:
      - app-network


volumes:
  mysql-data:


networks:
  app-network:
    driver: bridge
